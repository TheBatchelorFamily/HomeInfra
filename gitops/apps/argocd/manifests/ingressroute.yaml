apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argo.batchelorparty.com`) && Headers(`content-type`,`application/grpc`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
    - match: Host(`argo.batchelorparty.com`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: ""
