ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    uptime-kuma.io/monitor: "true"
  hosts:
    - host: plex.batchelorparty.com
      paths:
        - path: /
          pathType: Prefix

dnsPolicy: ClusterFirstWithHostNet

# Prefer AMD nodes when available, while allowing scheduling on Intel nodes.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: feature.node.kubernetes.io/cpu-model.vendor_id
              operator: In
              values:
                - AMD

extraVolumes:
  - name: plex-media-nfs
    nfs:
      server: 192.168.98.150  # Replace with your TrueNAS IP
      path: /mnt/BatchFlix/BatFlixShare # Replace with your NFS Export path
      readOnly: true        # Recommended for media libraries
  - name: dev-dri
    hostPath:
      path: /dev/dri

extraVolumeMounts:
  - name: plex-media-nfs
    mountPath: /data/media
  - name: dev-dri
    mountPath: /dev/dri

extraEnv:
  ADVERTISE_IP: "http://plex.batchelorparty.com:32400/"
  PLEX_UID: "972"
  PLEX_GID: "972"

pms:
  configStorage: 10Gi
  # Migrate the current config before syncing; switching claims requires recreating the StatefulSet.
  configExistingClaim: plex-config-longhorn
  claimSecret:
    name: "plex-secrets"
    key: "claim-token"

extraManifests:
  - |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: {{ .Values.pms.configExistingClaim }}
      labels:
        {{- include "pms-chart.labels" . | nindent 4 }}
      annotations:
        helm.sh/resource-policy: keep
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: {{ .Values.pms.configStorage }}

podSecurityContext:
  supplementalGroups: [39, 105]

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    metallb.universe.tf/address-pool: plex-pool
  ports:
    - name: plex
      port: 32400
      targetPort: 32400
      protocol: TCP
