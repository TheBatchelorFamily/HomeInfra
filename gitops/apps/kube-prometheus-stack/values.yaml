grafana:
  persistence:
    enabled: false
  ingress:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 2GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi
