grafana:
  persistence:
    enabled: false
  ingress:
    enabled: false
  revisionHistoryLimit: 2

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 2GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi

prometheusOperator:
  revisionHistoryLimit: 2

kube-state-metrics:
  revisionHistoryLimit: 2