---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd-image-updater.argoproj.io/image-list: plex=plexinc/pms-docker
    argocd-image-updater.argoproj.io/plex.update-strategy: newest-build
    argocd-image-updater.argoproj.io/plex.allow-tags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-.*$"
    argocd-image-updater.argoproj.io/plex.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/plex.helm.image-tag: image.tag
  name: plex
  namespace: argocd

spec:
  project: apps

  sources:
    - repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
      chart: plex-media-server
      targetRevision: 1.9.*
      helm:
        valueFiles:
          - $HomeInfra/gitops/apps/plex/values.yaml

    - repoURL: https://github.com/TheBatchelorFamily/HomeInfra.git
      targetRevision: main
      ref: HomeInfra

  destination:
    server: https://kubernetes.default.svc
    namespace: plex

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
